<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受渡口専用画面</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
    .column { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    .col-sub { flex: 3; }
    .col-main { flex: 7; }

    .column h2 { text-align: center; padding-bottom: 10px; border-bottom: 3px solid #eee; margin-top: 0; }
    .preparing-title { color: #e67e22; border-bottom-color: #e67e22 !important; }
    .ready-title { color: #27ae60; border-bottom-color: #27ae60 !important; }
    
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .receipt-number { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
    .items-list { font-size: 1.2rem; font-weight: bold; text-align: left; background: #fff; padding: 10px; border-radius: 4px; border: 1px dashed #ccc; margin-bottom: 15px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; color: #fff; width: 100%; }
    .btn-ready { background-color: #e67e22; }
    .btn-done { background-color: #27ae60; }
  </style>
</head>
<body>
  <h1>受渡口専用画面（音声出力メイン）</h1>
  <div class="container">
    <div class="column col-sub">
      <h2 class="preparing-title">調理中</h2>
      <div id="preparing-container" class="orders-grid"></div>
    </div>
    <div class="column col-main">
      <h2 class="ready-title">呼出中（受渡待ち）</h2>
      <div id="ready-container" class="orders-grid"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://order-new-97994-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ordersRef = db.ref('orders');
    const archiveRef = db.ref('archive');

    let isInitialLoad = true;
    let knownStatuses = {};

    let audioQueue = [];
    let isPlayingAudio = false;
    let batchTimer = null;

    function enqueueVoice(receiptNumber) {
      audioQueue.push(receiptNumber);
      if (isPlayingAudio) return;
      if (batchTimer) clearTimeout(batchTimer);
      batchTimer = setTimeout(() => {
        processAudioQueue();
      }, 2000);
    }

    async function processAudioQueue() {
      if (audioQueue.length === 0) { isPlayingAudio = false; return; }
      isPlayingAudio = true;
      const batch = [...audioQueue];
      audioQueue = []; 
      await playCustomVoiceBatch(batch);
      setTimeout(processAudioQueue, 1000);
    }

    async function playCustomVoiceBatch(receiptNumbers) {
      const playAudio = (fileName) => {
        return new Promise((resolve) => {
          const audio = new Audio('./audio/' + fileName);
          audio.onended = resolve; audio.onerror = resolve; audio.play().catch(resolve);
        });
      };
      try {
        await playAudio('prefix.mp3'); 
        for (let j = 0; j < receiptNumbers.length; j++) {
          const recNum = String(receiptNumbers[j]);
          for (let i = 0; i < recNum.length; i++) {
            const char = recNum[i];
            if (/[0-9]/.test(char)) await playAudio(char + '.mp3');
            else if (char === '-') await playAudio('hyphen.mp3');
          }
          await playAudio('ban.mp3');
          if (j < receiptNumbers.length - 1) await new Promise(res => setTimeout(res, 800));
        }
        await playAudio('suffix.mp3');
      } catch (e) { console.error("音声再生エラー", e); }
    }

    ordersRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const orders = [];
      for (let key in data) orders.push(data[key]);
      orders.sort((a, b) => a.timestamp - b.timestamp);
      renderOrders(orders);
    });

    function updateStatus(receiptNumber, newStatus, btnElement) {
      if (newStatus === '呼出中') {
        ordersRef.child(receiptNumber).update({ status: '呼出中' });
      } else if (newStatus === '受渡完了') {
        btnElement.closest('.card').remove();
        ordersRef.child(receiptNumber).once('value').then(snap => {
          const val = snap.val();
          if(val) {
            val.status = '受渡完了';
            const archiveKey = val.dailyReceiptId || receiptNumber;
            archiveRef.child(archiveKey).set(val).then(() => {
              ordersRef.child(receiptNumber).remove();
            });
          }
        });
      }
    }

    function renderOrders(orders) {
      const preparingContainer = document.getElementById('preparing-container');
      const readyContainer = document.getElementById('ready-container');
      const serverReceipts = orders.map(o => o.receiptNumber);

      document.querySelectorAll('.card').forEach(card => {
        const rec = card.dataset.receipt;
        if (!serverReceipts.includes(rec)) {
          card.remove(); delete knownStatuses[rec];
        }
      });

      orders.forEach(order => {
        let card = document.querySelector(`.card[data-receipt="${order.receiptNumber}"]`);
        const prevStatus = knownStatuses[order.receiptNumber];
        
        if (!card) {
          card = document.createElement('div'); card.className = 'card'; card.dataset.receipt = order.receiptNumber;
          const itemsHtml = order.items ? order.items.replace(/\n/g, '<br>') : 'なし';
          card.innerHTML = `<div class="receipt-number">${order.receiptNumber}</div><div class="items-list">${itemsHtml}</div>`;

          if (order.status === '調理中') {
            const btn = document.createElement('button');
            btn.className = 'btn btn-ready'; btn.innerText = '準備完了';
            btn.onclick = () => updateStatus(order.receiptNumber, '呼出中', btn);
            card.appendChild(btn); preparingContainer.appendChild(card);
          } else if (order.status === '呼出中') {
            const btn = document.createElement('button');
            btn.className = 'btn btn-done'; btn.innerText = '受渡';
            btn.onclick = () => updateStatus(order.receiptNumber, '受渡完了', btn);
            card.appendChild(btn); readyContainer.appendChild(card);
          }
        } else {
          if (order.status === '呼出中' && card.parentElement === preparingContainer) {
            readyContainer.appendChild(card);
            const btn = card.querySelector('button');
            btn.className = 'btn btn-done'; btn.innerText = '受渡';
            btn.onclick = () => updateStatus(order.receiptNumber, '受渡完了', btn);
          }
        }

        if (!isInitialLoad && order.status === '呼出中' && prevStatus !== '呼出中') {
           enqueueVoice(order.receiptNumber);
        }
        knownStatuses[order.receiptNumber] = order.status;
      });
      
      setTimeout(() => { isInitialLoad = false; }, 1000);
    }
  </script>
</body>
</html>
