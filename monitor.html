<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お呼び出し番号ディスプレイ</title>
  <link rel="stylesheet" href="monitor-common.css">
  <style>
    .monitor-top-bar {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .monitor-top-left {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .mini-menu-link {
      color: #95a5a6;
      text-decoration: none;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #dcdfe6;
      background: #fff;
      margin-right: 10px;
    }
    .audio-unlock-btn {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .audio-unlock-btn.unlocked {
      background: #27ae60;
    }
  </style>
</head>
<body class="fullscreen-board">

  <div class="monitor-top-bar">
    <div class="monitor-top-left">
      <a href="menu.html" class="mini-menu-link">🏠 メニュー</a>
      <span class="sync-badge" id="sync-status">通信中...</span>
    </div>
    <button class="audio-unlock-btn" id="audio-btn" onclick="unlockAndTestAudio()">
      🔇 タップして音声を有効化（テスト再生）
    </button>
  </div>

  <div class="board-container">
    <div class="column col-sub theme-amber monitor-col">
      <h2>🍳 調理・準備中</h2>
      <div id="prep-list" class="orders-grid"></div>
    </div>
    <div class="column col-main theme-green monitor-col">
      <h2>🔔 お呼び出し中（受取口へどうぞ）</h2>
      <div id="ready-list" class="orders-grid"></div>
    </div>
  </div>

  <script>
    var BASE_URL = 'https://order-new-97994-default-rtdb.firebaseio.com';
    var isInitialLoad = true;
    var knownState = {};

    var audioQueue = [];
    var isPlayingAudio = false;
    var batchTimer = null;
    // ★スタッフが連続で「呼出」を押した時に確実に1つのアナウンスにまとめるための待機時間（3.5秒）
    var BATCH_WAIT_MS = 3500;

    function httpReq(method, url, callback) {
      try {
        var xhr = new XMLHttpRequest();
        var fullUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + new Date().getTime();
        xhr.open(method, fullUrl, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
              var res = null;
              try { res = JSON.parse(xhr.responseText); } catch (e) {}
              if (callback) callback(null, res);
            } else {
              if (callback) callback(new Error('HTTP ' + xhr.status));
            }
          }
        };
        xhr.onerror = function() {
          if (callback) callback(new Error('Network Error'));
        };
        xhr.send(null);
      } catch (err) {
        if (callback) callback(err);
      }
    }

    function cleanStatus(st) {
      return String(st || '').replace(/^[\s ]+|[\s ]+$/g, '');
    }

    function isCallingStatus(s) {
      var st = cleanStatus(s);
      return st === '呼出中' || st === '呼び出し中' || st === '呼出し中';
    }

    function isDoneStatus(s) {
      var st = cleanStatus(s);
      return st === '受渡完了' || st === '受取済' || st === '完了' || st === 'キャンセル';
    }

    // --- 音声読み上げエンジン（複数番号まとめ対応） ---
    function playSingleFile(fileName, callback) {
      try {
        var audio = new Audio('./audio/' + fileName);
        var finished = false;
        var done = function() {
          if (finished) return;
          finished = true;
          if (callback) callback();
        };
        audio.onended = done;
        audio.onerror = done;
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(done);
        }
      } catch (e) {
        if (callback) callback();
      }
    }

    function playSequenceFiles(filesList, idx, onComplete) {
      if (idx >= filesList.length) {
        if (onComplete) onComplete();
        return;
      }
      var item = filesList[idx];
      if (item === '__PAUSE__') {
        // 「●番、×番」の間の自然な間（0.45秒）
        setTimeout(function() {
          playSequenceFiles(filesList, idx + 1, onComplete);
        }, 450);
      } else {
        playSingleFile(item, function() {
          playSequenceFiles(filesList, idx + 1, onComplete);
        });
      }
    }

    function enqueueVoice(receiptNumber) {
      // 同じ番号がすでに待機キューにあれば重複追加しない
      for (var i = 0; i < audioQueue.length; i++) {
        if (audioQueue[i] === receiptNumber) return;
      }
      audioQueue.push(receiptNumber);

      // すでに再生中の場合は、今の再生が終わった後に残りのキューが自動でまとめて再生される
      if (isPlayingAudio) return;

      // まだ再生中でなければ、連続タップを拾うためにタイマーをリセットして3.5秒待つ
      if (batchTimer) clearTimeout(batchTimer);
      batchTimer = setTimeout(function() {
        batchTimer = null;
        processAudioQueue();
      }, BATCH_WAIT_MS);
    }

    function processAudioQueue() {
      if (audioQueue.length === 0) {
        isPlayingAudio = false;
        return;
      }
      isPlayingAudio = true;

      // キューに溜まっている番号を取り出し、読み上げやすいよう番号順に並べる
      var batch = audioQueue.slice();
      audioQueue = [];

      // ★「レシート番号（prefix.mp3）」は先頭に1回だけ！
      var files = ['prefix.mp3'];

      // 続いて「●番、×番、▲番」を順番に繋げる
      for (var j = 0; j < batch.length; j++) {
        var recNum = String(batch[j]);
        for (var i = 0; i < recNum.length; i++) {
          var ch = recNum.charAt(i);
          if (/[0-9]/.test(ch)) files.push(ch + '.mp3');
          else if (ch === '-') files.push('hyphen.mp3');
        }
        files.push('ban.mp3');
        if (j < batch.length - 1) {
          files.push('__PAUSE__');
        }
      }

      // ★「のお客様〜（suffix.mp3）」も最後に1回だけ！
      files.push('suffix.mp3');

      playSequenceFiles(files, 0, function() {
        // 再生中にさらに追加された番号があれば、少し間を置いてまとめて再生
        if (audioQueue.length > 0) {
          setTimeout(processAudioQueue, 1000);
        } else {
          isPlayingAudio = false;
        }
      });
    }

    function unlockAndTestAudio() {
      var btn = document.getElementById('audio-btn');
      btn.className = 'audio-unlock-btn unlocked';
      btn.innerText = '🔊 呼出音声 ON（テスト再生中）';
      playSingleFile('prefix.mp3', function() {
        btn.innerText = '🔊 呼出音声 ON（自動再生有効）';
      });
    }

    function fetchMonitorOrders() {
      httpReq('GET', BASE_URL + '/orders.json', function(err, data) {
        var badge = document.getElementById('sync-status');
        if (err) {
          if (badge) badge.innerText = '⚠️ 通信エラー';
          return;
        }
        if (badge) badge.innerText = '🟢 同期OK';

        var orders = [];
        if (data && typeof data === 'object') {
          for (var key in data) {
            if (data.hasOwnProperty(key) && data[key] && typeof data[key] === 'object') {
              var ord = data[key];
              if (!ord.receiptNumber) ord.receiptNumber = key;
              orders.push(ord);
            }
          }
        }

        orders.sort(function(a, b) {
          return (a.timestamp || 0) - (b.timestamp || 0);
        });

        var prepHtml = '';
        var readyHtml = '';
        var currentIds = {};

        for (var i = 0; i < orders.length; i++) {
          var o = orders[i];
          var rec = o.receiptNumber;
          var st = cleanStatus(o.status);
          var recallAt = o.recallAt || 0;
          currentIds[rec] = true;

          var prev = knownState[rec];

          if (isCallingStatus(st)) {
            readyHtml += '<div class="ready-badge">' + rec + '</div>';

            if (!isInitialLoad) {
              if (!prev || !isCallingStatus(prev.status)) {
                enqueueVoice(rec);
              } else if (recallAt && recallAt !== prev.recallAt) {
                enqueueVoice(rec);
              }
            }
          } else if (!isDoneStatus(st)) {
            prepHtml += '<div class="prep-badge">' + rec + '</div>';
          }

          knownState[rec] = {
            status: st,
            recallAt: recallAt
          };
        }

        for (var k in knownState) {
          if (knownState.hasOwnProperty(k) && !currentIds[k]) {
            delete knownState[k];
          }
        }

        document.getElementById('prep-list').innerHTML = prepHtml;
        document.getElementById('ready-list').innerHTML = readyHtml;

        if (isInitialLoad) {
          setTimeout(function() { isInitialLoad = false; }, 500);
        }
      });
    }

    fetchMonitorOrders();
    setInterval(fetchMonitorOrders, 1200);
  </script>
</body>
</html>
