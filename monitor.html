<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お呼び出し番号ディスプレイ</title>
  <link rel="stylesheet" href="monitor-common.css">
</head>
<body class="fullscreen-board">
  <div class="board-container">
    <div class="column col-sub theme-amber monitor-col">
      <h2>🍳 調理・準備中</h2>
      <div id="prep-list" class="orders-grid"></div>
    </div>
    <div class="column col-main theme-green monitor-col">
      <h2>🔔 お呼び出し中（受取口へどうぞ）</h2>
      <div id="ready-list" class="orders-grid"></div>
    </div>
  </div>

  <script>
    var BASE_URL = 'https://order-new-97994-default-rtdb.firebaseio.com';

    function httpReq(method, url, callback) {
      try {
        var xhr = new XMLHttpRequest();
        var fullUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + new Date().getTime();
        xhr.open(method, fullUrl, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
              var res = null;
              try { res = JSON.parse(xhr.responseText); } catch (e) {}
              if (callback) callback(null, res);
            } else {
              if (callback) callback(new Error('HTTP ' + xhr.status));
            }
          }
        };
        xhr.onerror = function() {
          if (callback) callback(new Error('Network Error'));
        };
        xhr.send(null);
      } catch (err) {
        if (callback) callback(err);
      }
    }

    function cleanStatus(st) {
      return String(st || '').replace(/^[\s ]+|[\s ]+$/g, '');
    }

    function isCallingStatus(s) {
      var st = cleanStatus(s);
      return st === '呼出中' || st === '呼び出し中' || st === '呼出し中';
    }

    function isDoneStatus(s) {
      var st = cleanStatus(s);
      return st === '受渡完了' || st === '受取済' || st === '完了' || st === 'キャンセル';
    }

    function fetchMonitorOrders() {
      httpReq('GET', BASE_URL + '/orders.json', function(err, data) {
        if (err) return;

        var orders = [];
        if (data && typeof data === 'object') {
          for (var key in data) {
            if (data.hasOwnProperty(key) && data[key] && typeof data[key] === 'object') {
              var ord = data[key];
              if (!ord.receiptNumber) ord.receiptNumber = key;
              orders.push(ord);
            }
          }
        }

        orders.sort(function(a, b) {
          return (a.timestamp || 0) - (b.timestamp || 0);
        });

        var prepHtml = '';
        var readyHtml = '';

        for (var i = 0; i < orders.length; i++) {
          var o = orders[i];
          var st = cleanStatus(o.status);
          if (isCallingStatus(st)) {
            readyHtml += '<div class="ready-badge">' + o.receiptNumber + '</div>';
          } else if (!isDoneStatus(st)) {
            prepHtml += '<div class="prep-badge">' + o.receiptNumber + '</div>';
          }
        }

        document.getElementById('prep-list').innerHTML = prepHtml;
        document.getElementById('ready-list').innerHTML = readyHtml;
      });
    }

    fetchMonitorOrders();
    setInterval(fetchMonitorOrders, 1500);
  </script>
</body>
</html>
