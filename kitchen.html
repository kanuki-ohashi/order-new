<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キッチン専用画面</title>
  <link rel="stylesheet" href="monitor-common.css">
</head>
<body>
  <header class="app-header">
    <a href="menu.html" class="top-btn">🏠 メニュー</a>
    <h1>🍳 キッチン画面（ワンタップ即時呼出）</h1>
    <div class="header-right">
      <button class="sound-btn" onclick="playNotifySound()">🔊 通知音テスト</button>
      <span class="sync-badge" id="sync-status">通信中...</span>
    </div>
  </header>

  <!-- いま作るべき商品の合計個数をリアルタイム集計表示 -->
  <div class="item-summary-bar">
    <span class="summary-bar-title">📊 調理待ち合計：</span>
    <div id="item-summary-pills" class="summary-pills">
      <span style="color:#888; font-size:0.9rem;">現在調理待ちの商品はありません</span>
    </div>
  </div>

  <div class="board-container">
    <div class="column col-full theme-blue">
      <h2>🔥 調理中オーダー一覧 (<span id="count-cooking">0</span>件)</h2>
      <div id="cooking-container" class="orders-grid"></div>
    </div>
  </div>

  <script>
    var BASE_URL = 'https://order-new-97994-default-rtdb.firebaseio.com';
    var isInitialLoad = true;
    var knownOrderKeys = {};

    function httpReq(method, url, bodyObj, callback) {
      try {
        var xhr = new XMLHttpRequest();
        var fullUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + new Date().getTime();
        xhr.open(method, fullUrl, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
              var res = null;
              try { res = JSON.parse(xhr.responseText); } catch (e) {}
              if (callback) callback(null, res);
            } else {
              if (callback) callback(new Error('HTTP ' + xhr.status));
            }
          }
        };
        xhr.onerror = function() {
          if (callback) callback(new Error('Network Error'));
        };
        xhr.send(bodyObj ? JSON.stringify(bodyObj) : null);
      } catch (err) {
        if (callback) callback(err);
      }
    }

    function cleanStatus(st) {
      return String(st || '').replace(/^[\s ]+|[\s ]+$/g, '');
    }

    // 新仕様の "pending" と 旧仕様のステータス両方をキッチン対象として扱う
    function isKitchenTargetStatus(s) {
      var st = cleanStatus(s);
      return st === 'pending' || st === 'オーダー受領待' || st === 'オーダー受領待ち' || st === '受領待' || st === '受領待ち' || st === '調理中' || st === '未調理';
    }

    function playNotifySound() {
      try {
        var audio = new Audio('./audio/notify.mp3');
        audio.onerror = function() {
          try {
            var fallback = new Audio('./notify.mp3');
            fallback.play();
          } catch (e2) {}
        };
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function() {
            var fallback = new Audio('./notify.mp3');
            if (fallback.play) fallback.play();
          });
        }
      } catch (e) {}
    }

    function fetchKitchenOrders() {
      httpReq('GET', BASE_URL + '/orders.json', null, function(err, data) {
        var badge = document.getElementById('sync-status');
        if (err) {
          badge.innerText = '⚠️ 通信エラー';
          return;
        }
        var orders = [];
        if (data && typeof data === 'object') {
          for (var key in data) {
            if (data.hasOwnProperty(key) && data[key] && typeof data[key] === 'object') {
              var ord = data[key];
              // Firebaseのキーを注文IDのフォールバックにする
              if (!ord.receiptNumber && !ord.orderId) ord.receiptNumber = key; 
              orders.push(ord);
            }
          }
        }
        orders.sort(function(a, b) { return (a.timestamp || a.createdAt || 0) - (b.timestamp || b.createdAt || 0); });
        badge.innerText = '🟢 同期OK';
        renderKitchen(orders);
      });
    }

    function updateOrderStatus(receiptNumber, nextStatus) {
      // 呼出時刻（calledAt）も一緒に記録して、モニターの待ち時間計算等に使えるようにする
      var updateData = { 
        status: nextStatus,
        calledAt: new Date().getTime() 
      };
      httpReq('PATCH', BASE_URL + '/orders/' + encodeURIComponent(receiptNumber) + '.json', updateData, function() {
        fetchKitchenOrders();
      });
    }

    function cancelOrder(receiptNumber) {
      if (!confirm('呼出番号【' + receiptNumber + '】の注文を取り消して一覧から削除しますか？')) return;
      httpReq('DELETE', BASE_URL + '/orders/' + encodeURIComponent(receiptNumber) + '.json', null, function() {
        fetchKitchenOrders();
      });
    }

    function renderKitchen(orders) {
      var cookingContainer = document.getElementById('cooking-container');
      cookingContainer.innerHTML = '';

      var cookingCount = 0;
      var hasNewOrder = false;
      var currentKeys = {};
      var itemTotals = {};
      var itemOrderNames = [];

      for (var i = 0; i < orders.length; i++) {
        (function(order) {
          var rec = order.receiptNumber || order.orderId;
          var uniqueKey = order.dailyReceiptId || order.orderId || (rec + '_' + (order.timestamp || order.createdAt || ''));
          currentKeys[uniqueKey] = true;

          var st = cleanStatus(order.status);

          if (!isInitialLoad && !knownOrderKeys[uniqueKey] && isKitchenTargetStatus(st)) {
            hasNewOrder = true;
          }
          knownOrderKeys[uniqueKey] = true;

          if (!isKitchenTargetStatus(st)) return;

          cookingCount++;

          // 📊 商品ごとの調理待ち合計個数を集計（新旧データ両対応）
          if (Array.isArray(order.items)) {
            // ① 新仕様：構造化された配列データからの確実な集計
            for (var c = 0; c < order.items.length; c++) {
              var ci = order.items[c];
              if (ci && ci.name) {
                if (itemTotals[ci.name] === undefined) {
                  itemTotals[ci.name] = 0;
                  itemOrderNames.push(ci.name);
                }
                itemTotals[ci.name] += (parseInt(ci.qty, 10) || 1);
              }
            }
          } else if (order.items) {
            // ② 旧仕様：テキストデータからの抽出（下位互換）
            var lines = String(order.items).split(/\r?\n|\//);
            for (var l = 0; l < lines.length; l++) {
              var cleanLine = lines[l].trim();
              var m = cleanLine.match(/^(.+?)\s*[×xX]\s*([0-9]+)$/);
              if (m) {
                var iName = m[1].trim();
                var iQty = parseInt(m[2], 10) || 1;
                if (itemTotals[iName] === undefined) {
                  itemTotals[iName] = 0;
                  itemOrderNames.push(iName);
                }
                itemTotals[iName] += iQty;
              }
            }
          }

          // カードの描画生成
          var wrap = document.createElement('div');
          wrap.className = 'card-wrap';

          var card = document.createElement('div');
          card.className = 'card card-blue';
          
          // 明細の表示フォーマット（配列なら綺麗に結合、テキストなら改行変換）
          var itemsHtml = 'なし';
          if (Array.isArray(order.items)) {
              itemsHtml = order.items.map(function(item) { return item.name + ' × ' + item.qty; }).join('<br>');
          } else if (order.printText) {
              itemsHtml = order.printText.replace(/\//g, '<br>');
          } else if (order.items) {
              itemsHtml = String(order.items).replace(/\r?\n|\//g, '<br>');
          }
          
          var timePart = '';
          if (order.receiptTime) timePart = String(order.receiptTime).slice(11, 19);
          else if (order.createdAt) timePart = new Date(order.createdAt).toLocaleTimeString('ja-JP');

          var topDiv = document.createElement('div');
          topDiv.innerHTML = '<div class="card-header"><span class="receipt-number">' + rec + '</span><span class="order-time">' + timePart + '</span></div><div class="items-list" style="font-size:1.2em; font-weight:bold; line-height:1.4;">' + itemsHtml + '</div>';
          card.appendChild(topDiv);

          var btnBox = document.createElement('div');

          // 新機能：一発でモニター呼出に変更
          var completeBtn = document.createElement('button');
          completeBtn.className = 'btn btn-blue';
          completeBtn.style.backgroundColor = '#4caf50'; // 呼出ボタンっぽく緑色に上書き
          completeBtn.innerText = '🔔 即呼出（モニターへ）';
          completeBtn.onclick = function() { 
              if(confirm('番号【' + rec + '】のお客様を呼び出しますか？\n(モニターに番号が表示されます)')) {
                  // ステータスを 'called' にしてモニター側と連動させる
                  updateOrderStatus(rec, 'called'); 
              }
          };

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'btn btn-cancel-ord';
          cancelBtn.innerText = '✖ 取消';
          cancelBtn.onclick = function() { cancelOrder(rec); };

          btnBox.appendChild(completeBtn);
          btnBox.appendChild(cancelBtn);
          card.appendChild(btnBox);
          wrap.appendChild(card);
          cookingContainer.appendChild(wrap);
        })(orders[i]);
      }

      // 商品別合計ピルの描画
      var pillsContainer = document.getElementById('item-summary-pills');
      if (itemOrderNames.length === 0) {
        pillsContainer.innerHTML = '<span style="color:#888; font-size:0.9rem;">現在調理待ちの商品はありません</span>';
      } else {
        var pillsHtml = '';
        for (var p = 0; p < itemOrderNames.length; p++) {
          var name = itemOrderNames[p];
          pillsHtml += '<div class="summary-pill" style="font-size:1.2em; padding:8px 16px;">' + name + ' : <span style="font-size:1.3em;">' + itemTotals[name] + '</span></div>';
        }
        pillsContainer.innerHTML = pillsHtml;
      }

      for (var k in knownOrderKeys) {
        if (knownOrderKeys.hasOwnProperty(k) && !currentKeys[k]) {
          delete knownOrderKeys[k];
        }
      }

      if (hasNewOrder) {
        playNotifySound();
      }

      document.getElementById('count-cooking').innerText = cookingCount;

      if (isInitialLoad) {
        setTimeout(function() { isInitialLoad = false; }, 500);
      }
    }

    fetchKitchenOrders();
    setInterval(fetchKitchenOrders, 1500);
  </script>
</body>
</html>
