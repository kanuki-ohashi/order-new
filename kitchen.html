<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キッチン・提供</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #fff3e0; padding: 10px; }
        .order-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #ff9800; display: flex; justify-content: space-between; align-items: center; }
        .order-text { font-size: 1.5em; font-weight: bold; }
        .btn-call { background: #4caf50; color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>提供待ちリスト</h1>
    <div id="pending-list"></div>

    <script>
        const firebaseConfig = { /* あなたのFirebase設定をペースト */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('orders').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
            const list = document.getElementById('pending-list');
            list.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="order-card">
                        <div class="order-text">番号: ${data.orderId}<br><span style="color:#d32f2f;">${data.printText}</span></div>
                        <button class="btn-call" onclick="callOrder('${child.key}')">🔔 即呼出</button>
                    </div>
                `;
            });
        });

        function callOrder(key) {
            if(confirm("お客様を呼び出しますか？")) {
                db.ref('orders/' + key).update({
                    status: "called",
                    calledAt: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }
    </script>
</body>
</html>
