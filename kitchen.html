<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>客面モニター</title>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #212121; color: white; margin: 0; padding: 20px; }
        .wait-time { font-size: 4em; color: #ffeb3b; font-weight: bold; background: #333; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        .title { font-size: 3em; color: #4fc3f7; }
        .called-number { font-size: 15em; font-weight: bold; color: #ff5252; text-shadow: 0 0 20px rgba(255,82,82,0.5); margin: 0; line-height: 1; }
    </style>
</head>
<body>
    <div class="wait-time" id="wait-time-display">待ち時間計算中...</div>
    <div class="title">お呼び出し番号</div>
    <div class="called-number" id="latest-called">---</div>

    <script>
        const firebaseConfig = { /* あなたのFirebase設定をペースト */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 現場のペースに合わせて調整（1本あたり30秒想定）
        const SECONDS_PER_STICK = 30; 
        
        let manualWaitTime = 0;
        let pendingSticks = 0;

        // 待ち時間算出ロジック
        function updateDisplay() {
            const display = document.getElementById('wait-time-display');
            if (manualWaitTime > 0) {
                display.innerText = `ただいまの待ち時間：約 ${manualWaitTime} 分`;
            } else {
                let calcMinutes = Math.ceil((pendingSticks * SECONDS_PER_STICK) / 60);
                display.innerText = calcMinutes === 0 ? "すぐにご案内できます" : `ただいまの待ち時間：約 ${calcMinutes} 分`;
            }
        }

        db.ref('settings/manualWaitTime').on('value', snap => {
            manualWaitTime = snap.val() || 0;
            updateDisplay();
        });

        db.ref('orders').orderByChild('status').equalTo('pending').on('value', snap => {
            pendingSticks = 0;
            snap.forEach(child => {
                const items = child.val().items || [];
                items.forEach(item => pendingSticks += item.qty);
            });
            updateDisplay();
        });

        // 呼出監視
        db.ref('orders').orderByChild('status').equalTo('called').limitToLast(1).on('child_added', snap => {
            const data = snap.val();
            document.getElementById('latest-called').innerText = data.orderId;
            // 音を鳴らす（ブラウザの自動再生ポリシー許可が必要）
            // new Audio('chime.mp3').play().catch(e => console.log(e));
        });
    </script>
</body>
</html>
