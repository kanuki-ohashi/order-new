<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>POSレジ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #f4f4f4; }
        .container { display: flex; gap: 10px; }
        .left-panel, .right-panel { background: #fff; padding: 15px; border-radius: 8px; flex: 1; }
        .btn-item { padding: 15px; font-size: 1.2em; margin: 5px; width: 45%; background: #e0f7fa; border: 1px solid #00acc1; border-radius: 8px; cursor: pointer; }
        .btn-cash { padding: 10px; font-size: 1.1em; margin: 5px; background: #fff9c4; border: 1px solid #fbc02d; border-radius: 5px; cursor: pointer; }
        .btn-submit { padding: 20px; font-size: 1.5em; width: 100%; background: #d32f2f; color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; }
        #cart-list { min-height: 150px; font-size: 1.2em; }
        
        /* 印刷ON/OFFボタン */
        .print-toggle { padding: 10px; font-size: 1.1em; background: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .print-off { background: #9e9e9e; }

        /* 番号表示用モーダル（印刷OFF時） */
        #number-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; text-align: center; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
        .modal-number { font-size: 6em; font-weight: bold; color: #ffeb3b; }
        .modal-change { font-size: 3em; margin: 20px 0; }
        .btn-close-modal { padding: 20px 40px; font-size: 2em; background: #2196f3; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <button id="btn-print-toggle" class="print-toggle" onclick="togglePrint()">🖨️ レシート印刷：ON</button>

    <div class="container">
        <div class="left-panel">
            <h2>メニュー</h2>
            <!-- データ構造化のためID(momo_tare等)を付与 -->
            <button class="btn-item" onclick="addToCart('momo_tare', 'ももタレ', 400)">ももタレ ¥400</button>
            <button class="btn-item" onclick="addToCart('negima_shio', 'ねぎま塩', 400)">ねぎま塩 ¥400</button>
            <!-- メニューが増えたらここに追加 -->
        </div>

        <div class="right-panel">
            <h2>注文内容</h2>
            <div id="cart-list"></div>
            <h2 style="text-align: right;">合計: ¥<span id="total-price">0</span></h2>
            
            <hr>
            <h3>お預かり金: ¥<span id="tendered-price">0</span></h3>
            <button class="btn-cash" onclick="addCash(100)">+100</button>
            <button class="btn-cash" onclick="addCash(500)">+500</button>
            <button class="btn-cash" onclick="addCash(1000)">+1000</button>
            <button class="btn-cash" onclick="addCash(2000)">+2000</button>
            <button class="btn-cash" onclick="addCash(5000)">+5000</button>
            <button class="btn-cash" onclick="clearCash()" style="background:#f44336;color:white;border:none;">リセット</button>

            <button class="btn-submit" onclick="submitOrder()">会計する</button>
        </div>
    </div>

    <!-- 印刷OFF時の番号表示ポップアップ -->
    <div id="number-modal">
        <div>お客様の呼出番号</div>
        <div class="modal-number" id="modal-order-id">--</div>
        <div class="modal-change" id="modal-change-text">お釣り: ¥0</div>
        <button class="btn-close-modal" onclick="closeModal()">確認して次へ</button>
    </div>

    <script>
        const firebaseConfig = { /* あなたのFirebase設定をペースト */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cart = [];
        let total = 0;
        let tendered = 0;
        let isPrintEnabled = true;

        function togglePrint() {
            isPrintEnabled = !isPrintEnabled;
            const btn = document.getElementById('btn-print-toggle');
            if (isPrintEnabled) {
                btn.innerText = "🖨️ レシート印刷：ON";
                btn.classList.remove('print-off');
            } else {
                btn.innerText = "🚫 レシート印刷：OFF（画面に番号表示）";
                btn.classList.add('print-off');
            }
        }

        function addToCart(id, name, price) {
            let item = cart.find(i => i.id === id);
            if (item) item.qty++;
            else cart.push({ id, name, price, qty: 1 });
            updateCartUI();
        }

        function addCash(amount) {
            tendered += amount;
            document.getElementById('tendered-price').innerText = tendered;
        }

        function clearCash() {
            tendered = 0;
            document.getElementById('tendered-price').innerText = tendered;
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                list.innerHTML += `<div>${item.name} × ${item.qty} <button onclick="removeItem(${index})">削除</button></div>`;
            });
            document.getElementById('total-price').innerText = total;
            
            // 合計金額がお預かり金を上回った場合、お預かり金を自動引き上げ
            if(tendered > 0 && tendered < total) tendered = total; 
            document.getElementById('tendered-price').innerText = tendered;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function submitOrder() {
            if (cart.length === 0) return alert("カートが空です");
            if (tendered < total) return alert("お預かり金が不足しています");

            const change = tendered - total;
            const printText = cart.map(item => `${item.name}×${item.qty}`).join(" / ");
            // 以前の指示通り、番号は省略せず表示（例: 26-1234）
            const orderId = "26-" + Math.floor(1000 + Math.random() * 9000); 

            const orderData = {
                orderId: orderId,
                status: "pending", 
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                totalPrice: total,
                items: cart, // CSV集計用の構造化データ
                printText: printText
            };

            db.ref('orders/' + orderId).set(orderData).then(() => {
                if (isPrintEnabled) {
                    // SUNMIでのレシート印刷処理（Android側のJSインターフェース呼出）
                    if (window.Android && window.Android.printTicket) {
                        window.Android.printTicket(JSON.stringify({id: orderId, text: printText, total: total, change: change}));
                    }
                    alert(`会計完了\nお釣り: ¥${change}`);
                } else {
                    // 印刷OFF時は画面にデカデカと表示
                    document.getElementById('modal-order-id').innerText = orderId;
                    document.getElementById('modal-change-text').innerText = `お釣り: ¥${change}`;
                    document.getElementById('number-modal').style.display = 'flex';
                }
                
                // リセット
                cart = [];
                tendered = 0;
                updateCartUI();
            });
        }

        function closeModal() {
            document.getElementById('number-modal').style.display = 'none';
        }
    </script>
</body>
</html>
